<aside class="profile" aria-label="About Fang Li">
  <img class="avatar" src="{{ site.Params.avatar | relURL }}" width="160" height="160" alt="Fang Li outdoors in a wide-brimmed hat and sunglasses, by a lake.">
  <h1>{{ site.Title }}</h1>
  <p>{{ site.Params.bio }}<br>{{ site.Params.location }}</p>
  <nav class="social-links" aria-label="Social profiles">
    <a href="{{ site.Params.github }}" rel="me noopener" target="_blank">GitHub</a>
    <a href="{{ site.Params.linkedin }}" rel="me noopener" target="_blank">LinkedIn</a>
  </nav>
</aside>
