<!doctype html>
<html lang="{{ .Params.contentLanguage | default site.Language.Locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    {{ partial "header.html" . }}
    <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
