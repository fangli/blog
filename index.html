<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fang Li</title>
<meta name="description" content="Fang Li — software engineer, father of two, based in San Francisco, CA.">
<link rel="icon" href="avatar.jpg">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #59636e;
    --ring: rgba(31, 35, 40, 0.12);
    --border: rgba(31, 35, 40, 0.18);
    --hover: rgba(31, 35, 40, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --ring: rgba(240, 246, 252, 0.14);
      --border: rgba(240, 246, 252, 0.2);
      --hover: rgba(240, 246, 252, 0.07);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 28rem;
    text-align: center;
  }

  .avatar {
    width: 160px;
    height: 160px;
    max-width: 45vw;
    max-height: 45vw;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: 0 auto 1.5rem;
    box-shadow: 0 0 0 1px var(--ring);
  }

  h1 {
    margin: 0 0 0.75rem;
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .intro {
    list-style: none;
    margin: 0 0 2rem;
    padding: 0;
    color: var(--muted);
  }

  .intro .sep {
    margin: 0 0.15rem;
    opacity: 0.55;
  }

  .intro .nb { white-space: nowrap; }

  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.75rem;
  }

  .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: background-color 0.15s ease;
  }

  .links a:hover,
  .links a:focus-visible { background: var(--hover); }

  .links a:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
  }

  .links svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    flex: none;
  }
</style>
</head>
<body>
  <main>
    <img class="avatar" src="avatar.jpg" width="160" height="160"
         alt="Fang Li smiling outdoors in a wide-brimmed hat and sunglasses, by a lake.">
    <h1>Fang Li</h1>
    <ul class="intro">
      <li>
        <span>Father of two</span>
        <span class="sep" aria-hidden="true">&middot;</span>
        <span class="nb">Software engineer</span>
      </li>
      <li class="nb">San Francisco, CA</li>
    </ul>
    <nav class="links">

        GitHub
      </a>
      <a target="_blank" href="https://www.linkedin.com/in/lifang1991/" rel="me noopener">

    </nav>
  </main>
</body>
</html>
